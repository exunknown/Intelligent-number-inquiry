logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: ${oc.env:MYSQL_USER}
  password: ${oc.env:MYSQL_PASSWORD}
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: ${oc.env:MYSQL_USER}
  password: ${oc.env:MYSQL_PASSWORD}
  database: dw

db_sql_fallback:
  host: localhost
  port: 3307
  user: ${oc.env:SQL_FALLBACK_DB_USER,''}
  password: ${oc.env:SQL_FALLBACK_DB_PASSWORD,''}
  database: dw
  pool_size: 5
  max_overflow: 0
  pool_timeout_seconds: 3
  pool_recycle_seconds: 1800

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024
  timeout_seconds: ${oc.env:QDRANT_TIMEOUT_SECONDS,10}

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 19200
  index_name: data_agent
  timeout_seconds: ${oc.env:ES_TIMEOUT_SECONDS,10}

redis:
  enabled: ${oc.env:REDIS_ENABLED,true}
  host: ${oc.env:REDIS_HOST,127.0.0.1}
  port: ${oc.env:REDIS_PORT,6379}
  db: ${oc.env:REDIS_DB,0}
  password: ${oc.env:REDIS_PASSWORD,''}
  socket_timeout_seconds: ${oc.env:REDIS_SOCKET_TIMEOUT_SECONDS,2}
  event_ttl_seconds: ${oc.env:SSE_EVENT_TTL_SECONDS,900}
  max_events: ${oc.env:SSE_MAX_EVENTS,500}

cache:
  enabled: ${oc.env:QUERY_CACHE_ENABLED,true}
  embedding_ttl_seconds: ${oc.env:QUERY_CACHE_EMBEDDING_TTL_SECONDS,604800}
  column_recall_ttl_seconds: ${oc.env:QUERY_CACHE_COLUMN_RECALL_TTL_SECONDS,600}
  cube_member_recall_ttl_seconds: ${oc.env:QUERY_CACHE_CUBE_MEMBER_RECALL_TTL_SECONDS,600}
  value_recall_ttl_seconds: ${oc.env:QUERY_CACHE_VALUE_RECALL_TTL_SECONDS,300}
  cube_catalog_ttl_seconds: ${oc.env:QUERY_CACHE_CUBE_CATALOG_TTL_SECONDS,300}
  metric_result_ttl_seconds: ${oc.env:QUERY_CACHE_METRIC_RESULT_TTL_SECONDS,60}
  lock_ttl_seconds: ${oc.env:QUERY_CACHE_LOCK_TTL_SECONDS,10}
  lock_wait_seconds: ${oc.env:QUERY_CACHE_LOCK_WAIT_SECONDS,0.2}

minio:
  enabled: ${oc.env:MINIO_ENABLED,true}
  endpoint: ${oc.env:MINIO_ENDPOINT,127.0.0.1:9000}
  access_key: ${oc.env:MINIO_ACCESS_KEY,''}
  secret_key: ${oc.env:MINIO_SECRET_KEY,''}
  secure: ${oc.env:MINIO_SECURE,false}
  bucket: ${oc.env:MINIO_BUCKET,shopkeeper-results}
  configure_lifecycle: ${oc.env:MINIO_CONFIGURE_LIFECYCLE,false}
  export_ttl_seconds: ${oc.env:MINIO_EXPORT_TTL_SECONDS,900}
  max_object_bytes: ${oc.env:MINIO_MAX_OBJECT_BYTES,52428800}

llm:
  model_name: ${oc.env:LLM_MODEL_NAME}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL}
  timeout_seconds: ${oc.env:LLM_TIMEOUT_SECONDS,45}

ini:
  base_url: ${oc.env:INI_BASE_URL}
  api_key: ${oc.env:INI_API_KEY}
  chat_model: ${oc.env:INI_CHAT_MODEL}
  embedding_model: ${oc.env:INI_EMBEDDING_MODEL}
  rerank_model: ${oc.env:INI_RERANK_MODEL}

selector:
  enabled: true
  schema_token_threshold: 4000
  token_estimate_chars_per_token: 2.0

conversation:
  enabled: ${oc.env:CONVERSATION_ENABLED,true}
  recent_turns: ${oc.env:CONVERSATION_RECENT_TURNS,3}
  max_context_chars: ${oc.env:CONVERSATION_MAX_CONTEXT_CHARS,12000}
  clarification_enabled: ${oc.env:CONVERSATION_CLARIFICATION_ENABLED,true}
  resolver_timeout_seconds: ${oc.env:CONVERSATION_RESOLVER_TIMEOUT_SECONDS,8}

cube:
  base_url: http://127.0.0.1:4000/cubejs-api
  api_secret: ${oc.env:CUBE_API_SECRET}
  timeout_seconds: 10
  max_limit: 500
  semantic_view: ecommerce

keycloak_admin:
  base_url: ${oc.env:KEYCLOAK_ADMIN_BASE_URL,http://127.0.0.1:8180}
  realm: ${oc.env:KEYCLOAK_ADMIN_REALM,shopkeeper}
  client_id: ${oc.env:KEYCLOAK_ADMIN_CLIENT_ID,''}
  client_secret: ${oc.env:KEYCLOAK_ADMIN_CLIENT_SECRET,''}
  timeout_seconds: ${oc.env:KEYCLOAK_ADMIN_TIMEOUT_SECONDS,5}
  token_cache_skew_seconds: ${oc.env:KEYCLOAK_ADMIN_TOKEN_CACHE_SKEW_SECONDS,30}

auth:
  enabled: true
  issuer: ${oc.env:OIDC_ISSUER,http://127.0.0.1:8180/realms/shopkeeper}
  audience: ${oc.env:OIDC_AUDIENCE,shopkeeper-api}
  jwks_url: ${oc.env:OIDC_JWKS_URL,http://127.0.0.1:8180/realms/shopkeeper/protocol/openid-connect/certs}
  jwks_cache_seconds: 300
  clock_skew_seconds: 30

sql_safety:
  enabled: ${oc.env:SQL_FALLBACK_ENABLED,false}
  dialect: mysql
  max_sql_bytes: 32768
  max_ast_nodes: 2000
  max_nesting_depth: 12
  max_ctes: 16
  max_union_branches: 16
  max_rows: 500
  max_result_bytes: 1048576
  max_execution_ms: 5000
  max_estimated_rows: 100000
  max_query_cost: 100000

resource:
  request_timeout_seconds: ${oc.env:QUERY_REQUEST_TIMEOUT_SECONDS,120}
  max_request_body_bytes: ${oc.env:QUERY_MAX_REQUEST_BODY_BYTES,65536}
  global_concurrency: ${oc.env:QUERY_GLOBAL_CONCURRENCY,8}
  user_concurrency: ${oc.env:QUERY_USER_CONCURRENCY,2}
  rate_limit: ${oc.env:QUERY_RATE_LIMIT,30}
  rate_window_seconds: ${oc.env:QUERY_RATE_WINDOW_SECONDS,60}
  dependency_max_retries: ${oc.env:QUERY_DEPENDENCY_MAX_RETRIES,1}
  retry_backoff_seconds: ${oc.env:QUERY_RETRY_BACKOFF_SECONDS,0.1}
  max_llm_calls: ${oc.env:QUERY_MAX_LLM_CALLS,32}
  max_embedding_calls: ${oc.env:QUERY_MAX_EMBEDDING_CALLS,64}
  circuit_failure_threshold: ${oc.env:QUERY_CIRCUIT_FAILURE_THRESHOLD,3}
  circuit_open_seconds: ${oc.env:QUERY_CIRCUIT_OPEN_SECONDS,30}

sse:
  heartbeat_seconds: ${oc.env:SSE_HEARTBEAT_SECONDS,15}
  max_inline_result_bytes: ${oc.env:SSE_MAX_INLINE_RESULT_BYTES,262144}
  result_preview_rows: ${oc.env:SSE_RESULT_PREVIEW_ROWS,50}

metrics:
  enabled: ${oc.env:METRICS_ENABLED,true}
  path: ${oc.env:METRICS_PATH,/metrics}
  token: ${oc.env:METRICS_TOKEN,''}
